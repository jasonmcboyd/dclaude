name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Module Manifest
        shell: pwsh
        env:
          MODULE_VERSION: ${{ github.ref_name }}
        run: ./scripts/create-module-manifest.ps1 -Version $env:MODULE_VERSION

      - name: Publish To PowerShell Gallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
        run: Publish-Module -Path ./publish/dclaude -Repository PSGallery -NuGetApiKey $env:NUGET_API_KEY
