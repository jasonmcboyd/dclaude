name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-entrypoint:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the binary assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: entrypoint/go.mod

      - name: Vet
        working-directory: entrypoint
        run: go vet ./...

      - name: Test
        working-directory: entrypoint
        run: go test ./...

      - name: Build entrypoint binaries
        working-directory: entrypoint
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then
              ext=".exe"
            fi
            out="dist/dclaude-entrypoint-${os}-${arch}${ext}"
            echo "building $out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" .
          done
          ls -l dist

      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: entrypoint/dist/*

  publish:
    needs: build-entrypoint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Module Manifest
        shell: pwsh
        env:
          MODULE_VERSION: ${{ github.ref_name }}
        run: ./launchers/powershell/scripts/create-module-manifest.ps1 -Version $env:MODULE_VERSION

      - name: Publish To PowerShell Gallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
        run: Publish-Module -Path ./publish/dclaude -Repository PSGallery -NuGetApiKey $env:NUGET_API_KEY
