name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create Module Manifest
        shell: pwsh
        run: ./scripts/create-module-manifest.ps1 -Version "${{ github.ref_name }}"

      - name: Publish To PowerShell Gallery
        shell: pwsh
        run: Publish-Module -Path ./publish/dclaude -Repository PSGallery -NuGetApiKey ${{ secrets.POWERSHELL_GALLERY_API_KEY }}
